# MicroHOT sources.
#   beat:  "ai" or "gov" (the triage step can move a story to the other beat)
#   tier:  "T1" official / primary (labs, governments, regulators, standards bodies)
#          "T1.5" semi-official, "T2" media, newsletters, analysis, individuals
#   include / exclude: optional regex lists, matched case-insensitively against title + text.
#          Rules run before any model call, so filtering broad feeds here costs nothing.
