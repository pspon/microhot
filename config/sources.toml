# MicroHOT sources.
#   beat:  "ai", "ca" (Canada & Ontario) or "gov", as defined in config/site.toml [beats.*]
#          (the triage step can move a story to another beat)
#   tier:  "T1" official / primary (labs, governments, regulators, standards bodies)
#          "T1.5" semi-official, "T2" media, newsletters, analysis, individuals
#   kind:  "feed" (RSS/Atom, the default), "search" (a news-search feed: items from many outlets,
#          each outlet counted as its own source) or "page" (a web page without a feed, see below)
#   include / exclude / require: optional regex lists, matched case-insensitively against title + text.
#          An item needs one `include` match (if any are listed), every `require` match and no
#          `exclude` match. Rules run before any model call, so filtering broad feeds here costs nothing.
#   Page sources: `link_pattern` picks the news links on the page (a regex on each link's full URL).
#          The first read only records the links already there; after that, new links are new items.
#          fetch_text = true opens each new item's page for its description (plain requests, 0 tokens).
#          Feed items with little or no text get their page opened automatically (up to 8 per run);
#          fetch_text = true on a feed does it for every new item.
#   pause_s: wait this long before reading a source after another one on the same host.
# Set enabled = false to pause a source. Feed status shows on the site's About page, and
# `uv run microhot sources --check` reads every source now and reports what it would yield.

