name_zh = "影像、影片與語音"
group = "tech"
patterns = ['multimodal', 'image (generation|model|generator)', 'video (generation|model|generator)', 'text-to-(image|video|speech)', 'speech-to-text', 'speech (recognition|model|synthesis)', 'voice (mode|model|assistant|agent|clon\w*)', '\bSora\b', '\bVeo\b', 'Imagen', 'Midjourney']

[[topic]]
id = "compute"
name_en = "Chips and compute"
name_zh = "晶片與算力"
group = "tech"
patterns = ['\bGPUs?\b', '\bchips?\b', '\bTPUs?\b', 'data ?cent(er|re)s?', 'semiconductor', '\bTSMC\b', '\bAMD\b', 'Nvidia']

[[topic]]
id = "benchmarks"
name_en = "Benchmarks and evals"
name_zh = "評測基準"
group = "tech"
patterns = ['benchmark', 'leaderboard', 'SWE-bench', 'ARC-AGI', '\bMMLU\b', '\bGPQA\b', "Humanity.s Last Exam", '\bevals?\b']
