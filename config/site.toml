# MicroHOT 微熱 — site settings.
# Edit this file on GitHub (the mobile app works); changes apply on the next run.

[site]
name = "MicroHOT"
name_zh = "微熱"
tagline_en = "AI news, served slightly warm."
tagline_zh = "不燙口的 AI 新聞。"
# Public URL of the site (your Cloudflare Pages address). The SITE_URL secret overrides it.
url = "https://microhot.pages.dev"
timezone = "America/Toronto"
# The first run at or after this local time builds the daily edition and sends it to your channels.
edition_after = "06:00"
beat_order = ["ai", "ca", "gov"]

# Beats are the sections of the site and the editions. Each has its own daily quota.
#   why:        stories in this beat get a one-line "why it matters" note, written in the same model
#               call as the summary (a little more output, no extra calls)
#   thresholds: optional per-tier scores for this beat; tiers left out use [selection] thresholds
# Sources name their beat in config/sources.toml; the triage model can move a story to another beat.
[beats.ai]
label_en = "AI"
label_zh = "AI 動態"
daily_quota = 8

[beats.ca]
# Canadian public-sector AI: federal and Ontario government, regulators, legislatures, the broader
# public sector (hospitals, school boards, municipalities, agencies), and analysis of their rules.
label_en = "Canada & Ontario"
label_zh = "加拿大與安大略省"
daily_quota = 5
why = true
# A lower bar than the other beats, so official announcements and substantial legal or policy
# analysis get in; the quota keeps the volume down. Check "Near misses" on the About page.
thresholds = { T1 = 47, "T1.5" = 52, T2 = 60 }

[beats.gov]
label_en = "Governance & policy"
label_zh = "治理與政策"
daily_quota = 5

[selection]
# Minimum score (0–100) by the best source tier in an event. Starting point: AIHOT's values.
# A beat can override these (see [beats.ca]).
thresholds = { T1 = 60, "T1.5" = 65, T2 = 76 }
# Events scoring within this many points of their threshold get a second opinion.
borderline = 5
second_opinion = true
# Events first seen longer ago than this are no longer considered for selection.
candidate_hours = 36

[adjust]
# Your own nudges, applied by rule before the thresholds (no model calls).
# boost: points added (or, if negative, taken away) when a story matches a topic id from
#        config/topics.toml or a pattern (regular expression, case-insensitive).
# mute:  items matching any of these patterns are dropped while fetching, so they never reach a model.
boost = [
  # { topic = "canada", points = 8 },
  # { pattern = 'open[- ]weights?', points = 5, label = "open weights" },
]
mute = [
  # 'crypto|NFT',
]
max_points = 20

[editions]
# Stories highlighted after the lead story in each morning edition.
highlights = 3
# A story from an earlier edition comes back as a follow-up when it gains an official source,
# or at least this many new sources.
followup_min_new_sources = 2

[digest]
# Overviews for big stories: one model call per picked story with at least `min_sources`
# independent sources, at most `max_per_day` a day. Rewritten when it gains `regrow_sources` more.
enabled = true
min_sources = 3
max_per_day = 2
regrow_sources = 2
reports = 6        # reports given to the model, one per source, official sources first
report_chars = 700

[reviews]
# Built from the morning editions: last week's on Monday, last month's on the 1st.
weekly = true
monthly = true
weekly_stories = 12
monthly_stories = 20
overview = true    # one model call for a short overview; false = stories only

[radar]
# "On the radar" on the Today page: stories that were not picked, warmest first.
# A story stays this many hours after MicroHOT last found a report on it (not after it was published).
hours = 72
per_beat = 5
# Days of "Not picked" pages (by the day each story was found) and of unpicked stories in Search.
# The story log in the data repo (log/YYYY-MM.jsonl) keeps every story for good.
archive_days = 90

[feedback]
# Unpicked stories per beat in the morning GitHub issue, each with 👍 "wanted" and 👎 "rightly skipped":
# half the closest to the bar, half the warmest, from the stories found since the previous edition.
unpicked_per_beat = 4
# Ratings needed in a beat (with at least 3 👍 and 3 👎) before the About page and `microhot eval`
# suggest moving its thresholds. Topic boosts are suggested on top of that.
min_labels = 10

[alerts]
# A feed that fails this many runs in a row raises an alert (once, until it works again).
feed_errors_in_a_row = 3
# Where alerts go; each channel must also be enabled and configured below. [] turns alerts off.
channels = ["github_issue", "telegram"]

[fetch]
# A source's first import only takes items from the last N hours, so there is no backlog to pay for.
first_import_hours = 48
first_import_undated_max = 5
# After the first import, items older than this are ignored.
max_age_hours = 72
max_items_per_feed = 40
timeout_s = 20
workers = 8
# Sources on the same host are read one after another, this many seconds apart (a source's
# pause_s can ask for longer).
same_host_pause_s = 1.0
user_agent = "Mozilla/5.0 (compatible; MicroHOT/0.1; private news digest)"

[cluster]
window_hours = 72
# "lexical" needs no downloads. "model2vec:minishlab/potion-base-8M" uses a small local
# embedding model (install the `embed` extra); then raise the threshold to about 0.7.
embedder = "lexical"
threshold = 0.2

[heat]
window_hours = 48
half_life_hours = 24

[llm]
# Providers are tried in this order, per step. A provider is used only when it is configured:
# it is defined below AND its key (plus any ${VAR} in its base_url) is set as a secret.
# Unconfigured providers are never called and never count as failures.
triage = ["gemini", "groq", "openrouter", "mistral", "cloudflare", "claude", "deepseek"]
write = ["gemini", "claude", "groq", "openrouter", "mistral", "cloudflare", "deepseek"]
# Overviews for big stories and the weekly/monthly reviews use the write list unless set here:
# digest = ["claude", "gemini"]
# review = ["gemini", "claude"]
triage_batch_size = 20
write_batch_size = 4
# Hard caps across all providers (retries included).
max_calls_per_day = 40
usd_cap_per_day = 0.05
triage_text_chars = 600
write_text_chars = 1500
recent_events_in_prompt = 25

# ---- Providers ---------------------------------------------------------------------------
# api: "openai" (any OpenAI-compatible endpoint) or "anthropic" (native Claude API).
# json_mode: "schema" (strict JSON schema), "object" (JSON mode) or "prompt" (instructions only);
#            it steps down automatically if a provider rejects the stronger mode.
# Prices are USD per 1M tokens and only feed the usage page and the daily dollar caps.

[providers.gemini]
# Google AI Studio key. Free of charge while billing is not enabled on that Google project
# (free-tier prompts may be used by Google to improve its products).
api = "openai"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
models = ["gemini-3.5-flash-lite", "gemini-3.1-flash-lite"]
key_env = "GEMINI_API_KEY"
json_mode = "schema"
free = true
extra = { reasoning_effort = "low" }

[providers.groq]
api = "openai"
base_url = "https://api.groq.com/openai/v1"
models = ["openai/gpt-oss-120b", "qwen/qwen3.8-27b"]
key_env = "GROQ_API_KEY"
json_mode = "object"
free = true

[providers.openrouter]
# Free models end in ":free"; "openrouter/free" picks any available free model.
api = "openai"
base_url = "https://openrouter.ai/api/v1"
models = ["google/gemma-4-31b-it:free", "nvidia/nemotron-3-super-120b-a12b:free", "openrouter/free"]
key_env = "OPENROUTER_API_KEY"
json_mode = "object"
free = true

[providers.mistral]
api = "openai"
base_url = "https://api.mistral.ai/v1"
models = ["mistral-small-latest"]
key_env = "MISTRAL_API_KEY"
json_mode = "object"
free = true

[providers.cloudflare]
# Workers AI daily free allowance. Needs a token with Workers AI permission (separate from the
# Pages deploy token) and CLOUDFLARE_ACCOUNT_ID.
api = "openai"
base_url = "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1"
models = ["@cf/openai/gpt-oss-120b"]
key_env = "CLOUDFLARE_AI_TOKEN"
json_mode = "prompt"
free = true

[providers.claude]
# Native Claude API: schema-checked JSON and prompt caching.
api = "anthropic"
base_url = "https://api.anthropic.com/v1"
models = ["claude-haiku-5-5"]
key_env = "ANTHROPIC_API_KEY"
json_mode = "schema"
price_in = 0.10
price_out = 0.50
price_cached_in = 0.01
usd_cap_per_day = 0.03
extra = { thinking = { type = "disabled" } }

[providers.deepseek]
api = "openai"
base_url = "https://api.deepseek.com"
models = ["deepseek-flash"]
key_env = "DEEPSEEK_API_KEY"
json_mode = "object"
price_in = 0.30
price_out = 1.20
price_cached_in = 0.006
usd_cap_per_day = 0.03
extra = { thinking = { type = "disabled" } }

# Any other OpenAI-compatible endpoint works the same way, for example:
# [providers.openai]
# api = "openai"
# base_url = "https://api.openai.com/v1"
# models = ["<current small model>"]
# key_env = "OPENAI_API_KEY"
# max_tokens_param = "max_completion_tokens"
# price_in = 0.05
# price_out = 0.40
#
# [providers.ollama]            # e.g. your home server behind a tunnel; no key needed
# api = "openai"
# base_url = "${OLLAMA_URL}/v1"
# models = ["qwen3:8b"]
# json_mode = "object"
# free = true
# (then add "openai" / "ollama" to the triage and write lists above)

# ---- Delivery ----------------------------------------------------------------------------
# The private web page is always built; the channels below link back to it.
# A channel runs only when enabled here AND its secrets are set.

[channels.github_issue]
# Posts the morning edition as an issue in the private data repo (DATA_REPO; push notification in the GitHub app).
enabled = true
lang = "en"            # "en", "zh-TW" or "both"
close_previous = true
label = "edition"

[channels.email]
# Needs SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD and EMAIL_TO (Gmail: an app password).
enabled = true
lang = "both"

[channels.telegram]
# Needs TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID.
enabled = true
lang = "en"
max_stories = 8

[retention]
items_days = 30
events_days = 30
