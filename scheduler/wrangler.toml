# MicroHOT scheduler (Cloudflare Worker). Deployed by .github/workflows/scheduler.yml.
name = "microhot-scheduler"
main = "src/index.js"
compatibility_date = "2026-10-01"

# No public URL: the Worker only runs on its cron triggers.
workers_dev = false
preview_urls = false

[triggers]
# UTC. Each pair covers one Toronto run time in summer (UTC-4) and winter (UTC-5):
# 10/11 → 6:25, 16/17 → 12:25, 22/23 → 18:25. The Worker skips the half that is off by an hour.
# To change run times, edit these and RUN_HOURS together.
crons = ["25 10,11,16,17,22,23 * * *"]

[vars]
TIMEZONE = "America/Toronto"
RUN_HOURS = "6,12,18"
WORKFLOW = "run.yml"
REF = "main"
# REPO is set at deploy time from the repository the workflow runs in.
