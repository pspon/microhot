name: MicroHOT run

# Three runs a day in Toronto time (GitHub may start scheduled runs a few minutes late).
# The first run at or after 06:00 builds the morning edition and sends it to your channels.
on:
  schedule:
    - cron: "25 6,12,18 * * *"
      timezone: "America/Toronto"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "prompts/**"
      - "src/**"
      - "functions/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/run.yml"

permissions:
  contents: write # push the data branch
  issues: write # the GitHub-app channel posts the edition as an issue

concurrency:
  group: microhot-run
  cancel-in-progress: false

env:
  PAGES_PROJECT: microhot
  HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
  SITE_URL: ${{ vars.SITE_URL || secrets.SITE_URL }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Check out the data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git worktree add -B data data FETCH_HEAD
          else
            git worktree add --orphan -b data data
          fi

      - name: Fetch, score, write and render
        env:
          # Model providers. Any that are not set are skipped and never called.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OLLAMA_URL: ${{ secrets.OLLAMA_URL }}
        run: uv run --frozen microhot run

      - name: Publish to Cloudflare Pages
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch=main >/dev/null 2>&1 || true
          if [ -n "$SITE_PASSWORD" ]; then
            printf '%s' "$SITE_PASSWORD" | npx --yes wrangler@4 pages secret put SITE_PASSWORD --project-name="$PAGES_PROJECT"
          else
            echo "::warning::SITE_PASSWORD is not set, so the site stays closed (it never opens without a password)."
          fi
          npx --yes wrangler@4 pages deploy public --project-name="$PAGES_PROJECT" --branch=main --commit-dirty=true

      - name: Keep the built site as a download (until Cloudflare is set up)
        if: env.HAS_CLOUDFLARE != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: microhot-site
          path: public
          retention-days: 7

      - name: Send the morning edition
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run --frozen microhot deliver

      - name: Save data
        if: always()
        working-directory: data
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -q -m "data: run $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin HEAD:data
